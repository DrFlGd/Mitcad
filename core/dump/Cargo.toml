[package]
name = "mitcad-dump"
description = "The design dump IR of the .f3d and .ipt readers and the import (core/import/SCHEMA.md) as Rust types"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "mitcad_dump"

[dependencies]
# Vector helpers on [f64; 3] (the IR's `Vec3`).
mitcad-vec3 = { path = "../vec3" }
# The dump IR is JSON.
serde.workspace = true
serde_json.workspace = true
