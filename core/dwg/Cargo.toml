# SPDX-License-Identifier: MIT
[package]
name = "mitcad-dwg"
description = "Reader for .dwg drawings: the file header, sections and their decompression, the object map, classes, header variables, and the 3D content (B-rep solids, meshes, blocks and their inserts, layers); a writer of 2D drawings (R2000)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "mitcad_dwg"

[[bin]]
name = "mitcad-dwg-inspect"
path = "src/bin/mitcad-dwg-inspect.rs"
# It parses the solids, the import's part.
required-features = ["solids"]

[dependencies]
# The B-rep record of solids is an ASM file (binary, or its text form),
# parsed and converted by the ASM code the .f3d reader uses: only with the
# feature `solids` (the import, core/ffi); the drawing writer that
# mitcad-model uses (mitcad#728) needs none of it.
mitcad-asm = { path = "../asm", optional = true }
# Drawing units ($INSUNITS) shared with the DXF reader.
mitcad-dxf = { path = "../dxf" }
# Vector helpers on [f64; 3].
mitcad-vec3 = { path = "../vec3" }
# The drawing's summary and the import report as JSON.
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["solids"]
# The 3D content: the B-rep records of solids parsed and converted by the
# .f3d reader's ASM code, the scene and plan of the import, the test
# drawings (`scene`, `testfile`, `solid::parse`, mitcad-dwg-inspect).
solids = ["dep:mitcad-asm"]
