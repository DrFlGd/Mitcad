# SPDX-License-Identifier: MIT
[package]
name = "mitcad-import-base"
description = "What the imports share: their progress and its watchdog, vector helpers, the bodies of one replay, planar faces, the candidate core and small name and sketch helpers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "mitcad_import_base"

[dependencies]
mitcad-model.workspace = true
# Vector helpers on [f64; 3].
mitcad-vec3 = { path = "../vec3" }
serde_json.workspace = true

[dev-dependencies]
# The mock geometry kernel of the model tests.
mitcad-model = { workspace = true, features = ["testing"] }
