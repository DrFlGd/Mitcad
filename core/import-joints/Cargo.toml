# SPDX-License-Identifier: MIT
[package]
name = "mitcad-import-joints"
description = "The joints family of the design import's replay: joints, as-built joints, joint origins, captured positions, ground items and assembly relationships"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "mitcad_import_joints"

[dependencies]
mitcad-model.workspace = true
# The dump IR the replay reads.
mitcad-dump = { path = "../dump" }
# The replay's core this family extends (mitcad#785).
mitcad-import-replay = { path = "../import-replay" }
# What the imports share: vector helpers, the bodies of one replay, the
# watchdog's tick.
mitcad-import-base = { path = "../import-base" }
# Vector helpers on [f64; 3].
mitcad-vec3 = { path = "../vec3" }
serde.workspace = true
serde_json.workspace = true
