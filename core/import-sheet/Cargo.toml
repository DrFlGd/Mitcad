[package]
name = "mitcad-import-sheet"
description = "The sheet-metal family of the design import's replay: sheet items as Mitcad's native sheet features"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "mitcad_import_sheet"

[dependencies]
mitcad-model.workspace = true
# The dump IR the replay reads.
mitcad-dump = { path = "../dump" }
# The replay's core this family extends (mitcad#785).
mitcad-import-replay = { path = "../import-replay" }
# Vector helpers on [f64; 3].
mitcad-vec3 = { path = "../vec3" }
serde_json.workspace = true
