# SPDX-License-Identifier: MIT
[package]
name = "mitcad-import"
description = "Design import: the dump IR of an .f3d file replayed as Mitcad features; FreeCAD documents' bodies and structure"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "mitcad_import"

[dependencies]
mitcad-model.workspace = true
mitcad-f3d = { path = "../f3d" }
# FreeCAD .FCStd import (freecad/).
mitcad-freecad = { path = "../freecad" }
# IFC files (ifc/).
mitcad-ifc = { path = "../ifc" }
# The .rvt/.rfa reader (mitcad#274).
mitcad-rvt = { path = "../rvt" }
# .solidcraft designs (mitcad#450).
mitcad-solidcraft = { path = "../solidcraft" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The mock geometry kernel of the model tests.
mitcad-model = { workspace = true, features = ["testing"] }
# Test documents packed in memory.
mitcad-zip = { path = "../zip" }
