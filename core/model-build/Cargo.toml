[package]
name = "mitcad-model-build"
description = "The BUILD tab's planning above the Mitcad model: placing, connecting, frames and the cut list"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# No tests of its own: no test binary, which a change in the model would
# rebuild and link for nothing (mitcad#831).
[lib]
test = false

[dependencies]
mitcad-model.workspace = true
serde.workspace = true
serde_json.workspace = true
