# SPDX-License-Identifier: MIT
[package]
name = "mitcad-model-tests-sketch"
description = "Tests of the Mitcad model through its JSON api: sketch"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
doctest = false

[dev-dependencies]
mitcad-model = { workspace = true, features = ["testing"] }
mitcad-model-api = { path = "../../model-api" }
serde_json.workspace = true
# QR codes read back and font files read in the tests (mitcad#473).
rqrr = { version = "0.11.0", default-features = false }
skrifa = "0.48.0"
