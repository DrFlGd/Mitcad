# SPDX-License-Identifier: MIT
[package]
name = "mitcad-model"
description = "Parametric model, feature history and recompute logic for Mitcad"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
mitcad-solver = { path = "../solver" }
# Vector helpers on [f64; 3], shared with the solver and the readers.
mitcad-vec3 = { path = "../vec3" }
serde.workspace = true
serde_json.workspace = true
# Imported bodies and sketch export (data exchange).
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
mitcad-dxf = { path = "../dxf" }
# 3MF export for slicers (mitcad#13).
mitcad-3mf = { path = "../3mf" }
# USDZ export for AR viewers and other programs (mitcad#123).
mitcad-usdz = { path = "../usdz" }
# Sketch text from font files, shaped, in both directions (mitcad#473).
harfrust = "0.14.0"
skrifa = "0.48.0"
unicode-bidi = "0.3.18"
wuff = "0.2.9"
# SVG drawings into sketches (mitcad#473).
roxmltree = "0.20.0"
svgtypes = "0.16.1"
# QR codes in sketches (mitcad#473).
qrcode = { version = "0.14.1", default-features = false }
# Drawings written as .dwg files (mitcad#728): Mitcad's own writer beside
# its reader, without the 3D content (the feature `solids` needs the .f3d
# reader, whose tests use this crate).
mitcad-dwg = { path = "../dwg", default-features = false }

[dev-dependencies]
# QR codes read back in the tests (mitcad#473).
rqrr = { version = "0.11.0", default-features = false }
# Slicers' preset bundles (zips) the print settings tests write (mitcad#640).
mitcad-zip = { path = "../zip" }

[features]
# The mock geometry kernel (`mitcad_model::testing`) for other crates' tests.
testing = []
