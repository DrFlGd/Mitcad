# SPDX-License-Identifier: MIT
# The test runner over ctest (mitcad#790, README.md): profiles every test
# of ordinary runs and schedules the tests by a memory budget and a CPU
# gate. A member of the core workspace (core/Cargo.toml), so that its lock,
# clippy, rustfmt and cargo-deny cover it.
[package]
name = "mitcad-testrun"
description = "Mitcad's test runner over ctest: per-test profiles and scheduling by memory and CPU"
workspace = "../../core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "mitcad-testrun"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true

# wait4 (each test's CPU time and peak memory), statvfs, kill.
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"
